<style id="dd-advanced-inline-table-pattern">

<style id="dd-metric-tooltip-css">
/* Tooltip สำหรับ metric card ในหน้า วิเคราะห์แนวโน้มและกลุ่มผู้เรียน */
.metric-card{
  position:relative;
}

.metric-label{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.dd-help{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  border-radius:999px;
  background:#E8EAF6;
  color:#1A237E;
  border:1px solid #C5CAE9;
  font-size:12px;
  font-weight:900;
  cursor:help;
  position:relative;
  line-height:1;
  flex:0 0 auto;
}

.dd-help::after{
  content:attr(data-tooltip);
  position:absolute;
  left:50%;
  bottom:calc(100% + 10px);
  transform:translateX(-50%);
  width:min(320px,72vw);
  background:#1A237E;
  color:#FFFFFF;
  border-radius:14px;
  padding:12px 14px;
  box-shadow:0 14px 34px rgba(13,71,161,.24);
  font-size:12.5px;
  font-weight:500;
  line-height:1.65;
  text-align:left;
  white-space:normal;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  z-index:99999;
}

.dd-help::before{
  content:"";
  position:absolute;
  left:50%;
  bottom:calc(100% + 3px);
  transform:translateX(-50%);
  border-width:7px 7px 0 7px;
  border-style:solid;
  border-color:#1A237E transparent transparent transparent;
  opacity:0;
  visibility:hidden;
  z-index:99999;
}

.dd-help:hover::after,
.dd-help:hover::before,
.dd-help:focus::after,
.dd-help:focus::before{
  opacity:1;
  visibility:visible;
}

.dd-help:focus{
  outline:3px solid rgba(249,168,37,.45);
  outline-offset:2px;
}

/* Tooltip ในตาราง inline เช่น ตารางสรุปคุณภาพโมเดล */
.dd-inline-table-wrap .dd-help{
  margin-left:6px;
  vertical-align:middle;
}

@media(max-width:700px){
  .dd-help::after{
    left:auto;
    right:-8px;
    transform:none;
    width:min(300px,78vw);
  }

  .dd-help::before{
    left:auto;
    right:2px;
    transform:none;
  }
}
</style>

<script id="dd-final-refactor-js">
(function(){
  const lastFocus = {};
  function focusables(root){return Array.from(root.querySelectorAll('a[href],button:not([disabled]),textarea,input,select,iframe,[tabindex]:not([tabindex="-1"])')).filter(el=>el.offsetParent!==null || el.tagName==='IFRAME');}
  window.openDDModal = function(id){const bg=document.getElementById(id); if(!bg) return; lastFocus[id]=document.activeElement; bg.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; const fs=focusables(bg); (fs[0]||bg).focus();};
  window.closeDDModal = function(id){const bg=document.getElementById(id); if(!bg) return; bg.setAttribute('aria-hidden','true'); document.body.style.overflow=''; if(lastFocus[id] && lastFocus[id].focus) lastFocus[id].focus();};
  document.addEventListener('keydown', function(e){const open=document.querySelector('.dd-modal-backdrop[aria-hidden="false"]'); if(!open) return; if(e.key==='Escape'){e.preventDefault(); closeDDModal(open.id);} if(e.key==='Tab'){const fs=focusables(open); if(!fs.length) return; const first=fs[0], last=fs[fs.length-1]; if(e.shiftKey && document.activeElement===first){e.preventDefault(); last.focus();} else if(!e.shiftKey && document.activeElement===last){e.preventDefault(); first.focus();}}});
  document.addEventListener('click', function(e){const bg=e.target.closest('.dd-modal-backdrop'); if(bg && e.target===bg){closeDDModal(bg.id);}});
})();
</script>
